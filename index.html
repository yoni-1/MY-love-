<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>For My Queen</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; }
        #container { position: relative; z-index: 10; text-align: center; color: white; }
        button { padding: 20px 40px; font-size: 20px; background: #ff69b4; border: none; border-radius: 30px; color: white; cursor: pointer; }
        #text { display: none; margin-top: 20px; font-size: 24px; background: rgba(255, 105, 180, 0.3); padding: 20px; border-radius: 20px; }
    </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="container">
    <button onclick="show()">My everything</button>
    <div id="text">
        <p>የኔ ልዕልት የኔ ንግስት የኔ ሁሉ ነገር</p>
        <p>ታውቂያለሽ እኔ እግዚአብሔርን በጣም ነው የምወድሽ</p>
        <p>እሺ እናቴ የኔ ልዩ</p>
    </div>
</div>

<script>
    var c = document.getElementById("c");
    var ctx = c.getContext("2d");
    c.width = window.innerWidth;
    c.height = window.innerHeight;

    function drawHeart() {
        ctx.fillStyle = "rgba(0,0,0,0.1)";
        ctx.fillRect(0,0, c.width, c.height);
        ctx.fillStyle = "#ff69b4";
        // የልብ ነጥቦች
        for (let i = 0; i < 50; i++) {
            let x = Math.random() * c.width;
            let y = Math.random() * c.height;
            ctx.fillRect(x, y, 2, 2);
        }
        requestAnimationFrame(drawHeart);
    }
    drawHeart();

    function show() {
        document.getElementById("text").style.display = "block";
    }
</script>
</body>
</html>
